services:
  backend:
    build:
      context: .
      args:
        # GPU=1 selects the CUDA flavor of the NeMo-Speech.cpp runtime.
        # Transcription is GPU-only, so a GPU host MUST build with GPU=1
        # (GPU=1 docker compose up --build) or transcription fails with a
        # clear "no CUDA backend" error. The default CPU build serves the
        # non-transcription features only.
        GPU: ${GPU:-0}
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    # GPU passthrough: when the host has the NVIDIA container runtime,
    # the backend gets CUDA (NeMo-Speech.cpp transcription, YOLO, TransNetV2)
    # + video (NVENC encode). On CPU-only hosts this reservation is ignored
    # by Compose v2 (count: 0 when no GPU).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend

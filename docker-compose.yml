services:
  backend:
    build:
      context: .
      # GPU image (needs NVIDIA Docker support): GPU_BUILD=1 docker compose build backend.
      # Default 0 keeps the slim CPU image; the app auto-uses CUDA/NVENC when present.
      args:
        GPU: ${GPU_BUILD:-0}
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    # GPU passthrough: when the host has the NVIDIA container runtime,
    # the backend automatically uses NVENC (encode) + CUDA (decode/Whisper/
    # YOLO/Parakeet). On CPU-only hosts this reservation is ignored by
    # Compose v2 (count: 0 when no GPU) and the app falls back to CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
      - VITE_RENDER_TARGET=http://renderer:3100
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
